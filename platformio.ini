; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitm-1]
; Arduino-ESP32 3.3.x sobre ESP-IDF 5.5.x.
; Se fija la rama 8.0 para evitar actualizaciones mayores inesperadas.
platform = espressif32 @ ~8.0.0
board = esp32-c3-devkitm-1
framework = arduino

; Dos particiones OTA, sin sistema de archivos (el firmware no usa SPIFFS).
; NVS conserva su offset y tamano respecto al esquema default.
board_build.partitions = no_fs.csv

upload_port = COM5
monitor_port = COM5
monitor_speed = 115200
monitor_echo = yes
monitor_filters =
    send_on_enter

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=0
    ; Migracion temporal: quitar esta bandera despues de sembrar NVS.
    -D ENABLE_DEVELOPMENT_BOOTSTRAP=1
    ; Transporte serie controlado para validar la Fase 4 sin backend.
    -D ENABLE_LOCAL_PROVISIONING_MOCK=1
    ; Permite servir manifiestos OTA firmados desde la red local de pruebas.
    -D ENABLE_LOCAL_OTA_MOCK=1

lib_deps = 
    paulstoffregen/OneWire
    milesburton/DallasTemperature
    Wire
    claws/BH1750
    adafruit/Adafruit SHT4x Library
    knolleary/PubSubClient
    bblanchon/ArduinoJson
