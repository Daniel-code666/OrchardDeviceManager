<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Huerta · Aprovisionamiento Web Serial</title>
  <style>
    body{font:16px system-ui;max-width:52rem;margin:2rem auto;padding:0 1rem;color:#183126;background:#f4f8f5}
    section{background:white;border:1px solid #cbd9d0;border-radius:12px;padding:1rem 1.25rem;margin:1rem 0}
    label{display:block;margin:.8rem 0}input,button{font:inherit;box-sizing:border-box;padding:.65rem;border-radius:7px;border:1px solid #91a89a}
    input{width:100%}button{cursor:pointer;background:#17663d;color:white;border:0;margin-right:.5rem}
    pre{white-space:pre-wrap;max-height:18rem;overflow:auto;background:#10251a;color:#d8f5e3;padding:1rem;border-radius:8px}
    .state{font-weight:700}.hint{color:#52695b;font-size:.9rem}.hidden{display:none}
  </style>
</head>
<body>
  <h1>Configurar dispositivo Huerta</h1>
  <p class="hint">Herramienta local de las fases 8 a 14. Requiere Chrome o Edge y una conexión USB.</p>
  <section><button id="connect">Conectar dispositivo</button><button id="disconnect" disabled>Desconectar</button>
    <button id="identify" disabled>Identificar</button><button id="evidence" disabled>Descargar evidencia</button>
    <span id="state" class="state">Sin conexión</span></section>
  <section><form id="bootstrap">
    <label>Red Wi‑Fi<input id="ssid" maxlength="32" required autocomplete="off"></label>
    <label>Contraseña Wi‑Fi<input id="password" type="password" maxlength="64" autocomplete="new-password"></label>
    <div id="bootstrap-only">
      <label>URL del servicio accesible por el ESP<input id="baseUrl" placeholder="http://192.168.0.10:8090" required></label>
      <label>Token de aprovisionamiento<input id="token" type="password" minlength="16" required autocomplete="off"></label>
    </div>
    <button id="send" disabled>Configurar</button>
  </form></section>
  <section><h2>Eventos del dispositivo</h2><pre id="log"></pre></section>
<script>
let port, reader, writer, readTask, buffer = '', provisioned = false, identifiedDevice = null;
const evidenceEvents = [];
const log = document.querySelector('#log');
const state = document.querySelector('#state');
const requestId = () => crypto.randomUUID().replaceAll('-', '').slice(0, 32);
function append(value){ log.textContent += `${value}\n`; log.scrollTop = log.scrollHeight; }
async function send(message){ await writer.write(new TextEncoder().encode(`${JSON.stringify(message)}\n`)); }
function capture(event){
  evidenceEvents.push({receivedAt:new Date().toISOString(),payload:event});
  document.querySelector('#evidence').disabled=!identifiedDevice;
}
function setProvisioningMode(value){
  provisioned=value;
  document.querySelector('#bootstrap-only').classList.toggle('hidden',value);
  document.querySelector('#baseUrl').required=!value;
  document.querySelector('#token').required=!value;
  document.querySelector('#send').textContent=value?'Actualizar Wi-Fi':'Configurar';
}
async function readLoop(){
  const decoder = new TextDecoder();
  while (port?.readable) {
    const activeReader=port.readable.getReader(); reader=activeReader;
    try { while (true) { const {value,done}=await activeReader.read(); if(done) break; buffer += decoder.decode(value,{stream:true});
      const lines=buffer.split(/\r?\n/); buffer=lines.pop(); for(const line of lines){
        if(!line.trim().startsWith('{')) continue;
        try { const event=JSON.parse(line); append(JSON.stringify(event,null,2)); capture(event);
          if(event.type==='device_identify_result'){
            identifiedDevice={deviceId:event.deviceId,hardwareId:event.hardwareId,
              firmwareVersion:event.firmwareVersion,board:event.board};
            setProvisioningMode(event.provisioningState==='provisioned');
            state.textContent=`${event.deviceId} · ${event.provisioningState}`;
          }
          if(event.type==='device_configuration_status') state.textContent=`${event.stage}: ${event.status}${event.errorCode?' · '+event.errorCode:''}`;
        } catch {}
      }}
    } finally { activeReader.releaseLock(); if(reader===activeReader) reader=null; }
  }
}
document.querySelector('#connect').onclick=async()=>{
  if(!('serial' in navigator)){ state.textContent='Web Serial no está disponible'; return; }
  evidenceEvents.length=0; identifiedDevice=null; log.textContent='';
  document.querySelector('#evidence').disabled=true;
  port=await navigator.serial.requestPort(); await port.open({baudRate:115200,bufferSize:8192});
  writer=port.writable.getWriter(); state.textContent='Conectado por USB';
  document.querySelector('#connect').disabled=true; document.querySelector('#disconnect').disabled=false;
  document.querySelector('#identify').disabled=false; document.querySelector('#send').disabled=false;
  readTask=readLoop().catch(error=>append(`Lectura finalizada: ${error.message}`));
};
document.querySelector('#disconnect').onclick=async()=>{
  try { if(reader) await reader.cancel(); } catch {}
  try { if(readTask) await readTask; } catch {}
  try { if(writer){ writer.releaseLock(); writer=null; } } catch {}
  try { if(port) await port.close(); } catch {}
  port=null; readTask=null; buffer=''; state.textContent='Sin conexión';
  document.querySelector('#connect').disabled=false; document.querySelector('#disconnect').disabled=true;
  document.querySelector('#identify').disabled=true; document.querySelector('#send').disabled=true;
};
document.querySelector('#identify').onclick=()=>send({type:'device_identify',contractVersion:1,requestId:requestId()});
document.querySelector('#evidence').onclick=()=>{
  if(!identifiedDevice) return;
  const evidence={schemaVersion:1,capturedAt:new Date().toISOString(),device:identifiedDevice,
    events:evidenceEvents};
  const blob=new Blob([`${JSON.stringify(evidence,null,2)}\n`],{type:'application/json'});
  const anchor=document.createElement('a'); anchor.href=URL.createObjectURL(blob);
  const stamp=new Date().toISOString().replaceAll(':','-').replace(/\.\d{3}Z$/,'Z');
  anchor.download=`huerta-web-${identifiedDevice.deviceId}-${stamp}.json`; anchor.click();
  setTimeout(()=>URL.revokeObjectURL(anchor.href),1000);
};
document.querySelector('#bootstrap').onsubmit=async(event)=>{
  event.preventDefault();
  const wifi={ssid:document.querySelector('#ssid').value,password:document.querySelector('#password').value};
  if(provisioned){
    await send({type:'device_wifi_reconfigure',contractVersion:1,requestId:requestId(),wifi});
    state.textContent='Nueva red enviada; probando Wi-Fi';
  }else{
    await send({type:'device_bootstrap',contractVersion:1,requestId:requestId(),wifi,
      service:{baseUrl:document.querySelector('#baseUrl').value},provisioningToken:document.querySelector('#token').value});
    state.textContent='Bootstrap enviado; probando Wi‑Fi';
  }
};
</script></body></html>
